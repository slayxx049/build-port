<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>Build Log | Protected Preview</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;font-family:Manrope,Arial,sans-serif}
  #profile{position:fixed;inset:0;width:100%;height:100%;border:0;background:#08090d}
  #lockLayer{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(5,7,12,.48);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);color:#f4f4f5}
  #lockLayer.visible{display:flex}
  .lock-card{width:min(420px,100%);padding:30px;border:1px solid rgba(255,255,255,.17);border-radius:20px;background:rgba(12,15,22,.91);box-shadow:0 24px 90px rgba(0,0,0,.48);text-align:left}
  .lock-mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:14px;color:#d5f5a5;font-size:23px;margin-bottom:22px}
  .eyebrow{margin:0 0 9px;color:#a7b68d;font:11px/1.4 monospace;letter-spacing:.18em;text-transform:uppercase}
  h1{margin:0 0 9px;font-size:25px;letter-spacing:-.04em}
  .hint{margin:0 0 22px;color:#a6a8b1;font-size:13px;line-height:1.6}
  label{display:block;margin:0 0 8px;color:#d8d9df;font-size:12px}
  input{width:100%;height:48px;padding:0 14px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:#080a0f;color:#fff;font-size:15px;outline:none}
  input:focus{border-color:#b9d68b;box-shadow:0 0 0 3px rgba(185,214,139,.12)}
  button{width:100%;height:47px;margin-top:13px;border:0;border-radius:10px;background:#d6efa8;color:#11150b;font-weight:800;font-size:13px;cursor:pointer}
  button:hover{background:#e3f8bd}
  #message{min-height:18px;margin:11px 0 0;color:#f0a3a3;font-size:12px}
  .fineprint{margin:15px 0 0;color:#777d8b;font:10px/1.5 monospace}
  @media(max-width:480px){.lock-card{padding:24px}}
</style>
</head>
<body>
<iframe id="profile" title="Existing Build Log portfolio" src="./"></iframe>

<div id="lockLayer" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="lock-card">
    <div class="lock-mark" aria-hidden="true">⌑</div>
    <p class="eyebrow">BUILD / LOG · ACCESS CONTROL</p>
    <h1 id="lockTitle">This profile is locked</h1>
    <p class="hint">The original profile remains behind this transparent lock. Enter the preview passcode to continue.</p>
    <form id="unlockForm">
      <label for="passcode">Passcode</label>
      <input id="passcode" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter preview passcode" required>
      <button type="submit">UNLOCK PROFILE</button>
      <p id="message" aria-live="polite"></p>
    </form>
    <p class="fineprint">VISUAL PROTOTYPE ONLY · NOT PRODUCTION AUTHENTICATION</p>
  </div>
</div>

<script>
(() => {
  const frame = document.getElementById('profile');
  const layer = document.getElementById('lockLayer');
  const form = document.getElementById('unlockForm');
  const input = document.getElementById('passcode');
  const message = document.getElementById('message');
  const PREVIEW_PASSCODE = '2468'; // Demo only. Replace with server-side authentication before public use.
  let locked = false;
  let unlocked = false;
  let pendingHref = null;

  function showLock(event) {
    if (locked || unlocked) return;
    if (event) {
      const anchor = event.target && event.target.closest ? event.target.closest('a[href]') : null;
      if (anchor) pendingHref = anchor.getAttribute('href');
      event.preventDefault();
      event.stopPropagation();
      if (event.stopImmediatePropagation) event.stopImmediatePropagation();
    }
    locked = true;
    layer.classList.add('visible');
    message.textContent = '';
    window.setTimeout(() => input.focus(), 30);
  }

  function attachClickGuard() {
    try {
      const doc = frame.contentDocument;
      if (!doc) return;
      doc.addEventListener('click', showLock, true);
    } catch (error) {
      message.textContent = 'The preview could not attach to the portfolio frame.';
    }
  }

  frame.addEventListener('load', attachClickGuard);

  form.addEventListener('submit', event => {
    event.preventDefault();
    if (input.value !== PREVIEW_PASSCODE) {
      message.textContent = 'Incorrect preview passcode. Try again.';
      input.select();
      return;
    }
    layer.classList.remove('visible');
    locked = false;
    unlocked = true;
    input.value = '';
    const destination = pendingHref;
    pendingHref = null;
    if (destination) {
      try {
        if (destination.startsWith('#')) frame.contentWindow.location.hash = destination;
        else frame.contentWindow.location.href = destination;
      } catch (error) {
        // The profile remains unlocked; the visitor can click the destination again.
      }
    }
  });
})();
</script>
</body>
</html>
